<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Portal</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #e9ecef;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .loading-screen {
      text-align: center;
    }

    /* 8-dot ring spinner (matches AASTMT portal style) */
    .spinner {
      position: relative;
      width: 48px;
      height: 48px;
      margin: 0 auto 28px;
    }

    .spinner span {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 8px;
      height: 8px;
      margin: -4px 0 0 -4px;
      background: #6c757d;
      border-radius: 50%;
      animation: dot-fade 1.2s linear infinite;
    }

    .spinner span:nth-child(1)  { transform: rotate(0deg)   translateY(-20px); animation-delay: 0s; }
    .spinner span:nth-child(2)  { transform: rotate(45deg)  translateY(-20px); animation-delay: -1.05s; }
    .spinner span:nth-child(3)  { transform: rotate(90deg)  translateY(-20px); animation-delay: -0.9s; }
    .spinner span:nth-child(4)  { transform: rotate(135deg) translateY(-20px); animation-delay: -0.75s; }
    .spinner span:nth-child(5)  { transform: rotate(180deg) translateY(-20px); animation-delay: -0.6s; }
    .spinner span:nth-child(6)  { transform: rotate(225deg) translateY(-20px); animation-delay: -0.45s; }
    .spinner span:nth-child(7)  { transform: rotate(270deg) translateY(-20px); animation-delay: -0.3s; }
    .spinner span:nth-child(8)  { transform: rotate(315deg) translateY(-20px); animation-delay: -0.15s; }

    @keyframes dot-fade {
      0%, 39%, 100% { opacity: 0.25; }
      40% { opacity: 1; }
    }

    .loading-text {
      font-size: 1.35rem;
      font-weight: 600;
      color: #5a6268;
      letter-spacing: 0.01em;
    }

    .error-text {
      display: none;
      margin-top: 16px;
      font-size: 0.9rem;
      color: #b91c1c;
      max-width: 420px;
      line-height: 1.5;
    }

    .error-text.visible { display: block; }
  </style>
</head>
<body>
  <div class="loading-screen">
    <div class="spinner" id="spinner" aria-hidden="true">
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
    </div>
    <p class="loading-text" id="loadingText">Student Portal is Loading ...</p>
    <p class="error-text" id="errorText"></p>
  </div>

  <script>
    const DOCMIND_USERNAME = 'aya_s';
    const DOCMIND_PASSWORD = 'student123';
    const API_BASE_URL = sessionStorage.getItem('docmind_api')
      || `http://${window.location.hostname}:5000/api`;
    const DOCMIND_APP_URL = sessionStorage.getItem('docmind_url')
      || 'http://localhost:5173';

    const errorEl = document.getElementById('errorText');
    const spinnerEl = document.getElementById('spinner');
    const loadingTextEl = document.getElementById('loadingText');

    function showError(message) {
      spinnerEl.style.display = 'none';
      loadingTextEl.style.display = 'none';
      errorEl.textContent = message;
      errorEl.classList.add('visible');
    }

    async function loginToDocMind() {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 15000);

      try {
        const res = await fetch(`${API_BASE_URL}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: DOCMIND_USERNAME, password: DOCMIND_PASSWORD }),
          signal: controller.signal,
        });

        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          const detail = body.message || body.detail || `HTTP ${res.status}`;
          throw new Error(detail);
        }

        const data = await res.json();
        if (!data?.token || !data?.user) {
          throw new Error('Login response missing token or user');
        }
        return data;
      } catch (err) {
        if (err.name === 'AbortError') {
          throw new Error(`Timed out reaching ${API_BASE_URL}. Is the backend running?`);
        }
        if (err.message === 'Failed to fetch') {
          throw new Error(
            `Cannot reach ${API_BASE_URL}. Check backend port and CORS (origin: ${window.location.origin}).`
          );
        }
        throw err;
      } finally {
        clearTimeout(timeout);
      }
    }

    async function startHandoff() {
      try {
        const loginResult = await loginToDocMind();

        const ssoPayload = encodeURIComponent(JSON.stringify({
          token: loginResult.token,
          user: loginResult.user,
        }));

        window.location.href = `${DOCMIND_APP_URL}/home?sso=${ssoPayload}`;
      } catch (err) {
        showError(err.message || 'Unable to open application. Please try again.');
        console.error('SSO handoff failed:', err);
      }
    }

    startHandoff();
  </script>
</body>
</html>
