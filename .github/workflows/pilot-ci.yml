name: Pilot CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: pass123
          POSTGRES_DB: docmind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d docmind_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend/src
    env:
      # The service port is published on the runner's IPv4 loopback. Avoid
      # Ubuntu resolving localhost to ::1 before the mapped service address.
      TEST_DATABASE_URL: postgresql+asyncpg://admin:pass123@127.0.0.1:5432/docmind_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            backend/src/requirements.txt
            backend/src/requirements-test.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt -r requirements-test.txt
      - name: Verify test database
        run: |
          python - <<'PY'
          import asyncio
          import os

          import asyncpg


          async def main() -> None:
              url = os.environ["TEST_DATABASE_URL"].replace(
                  "postgresql+asyncpg://", "postgresql://", 1
              )
              connection = await asyncpg.connect(url, timeout=10)
              try:
                  assert await connection.fetchval("SELECT 1") == 1
              finally:
                  await connection.close()


          asyncio.run(main())
          PY
      - name: Run backend tests
        run: pytest tests -q -p no:cacheprovider

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  flutter-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/docmind_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test test/message_contract_test.dart
